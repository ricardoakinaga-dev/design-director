    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8bd0c0"/>
      <stop offset="1" stop-color="#387f86"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb77d"/>
      <stop offset="1" stop-color="#d65b5f"/>
    </linearGradient>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="15" r="1.4" fill="#d9f0dc" opacity="0.16"/>
      <circle cx="54" cy="40" r="1" fill="#d9f0dc" opacity="0.14"/>
      <circle cx="28" cy="67" r="0.8" fill="#d9f0dc" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sea)"/>
