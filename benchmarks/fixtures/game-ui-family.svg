<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Original Tidelane game UI and asset family reference</title>
  <desc id="desc">A fictional side-on exploration game style sheet showing a player silhouette, layered tidepool environment, HUD, icons, and collectible family.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102d42"/>
      <stop offset="1" stop-color="#071723"/>
