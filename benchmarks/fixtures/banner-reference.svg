<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Original Northstar field banner reference</title>
  <desc id="desc">A synthetic dusk field composition with a quiet left text zone, a warm horizon, and a right-side navigation beacon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b36"/>
      <stop offset="0.56" stop-color="#1b4650"/>
      <stop offset="1" stop-color="#d8784d"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e5b58"/>
      <stop offset="1" stop-color="#10252f"/>
    </linearGradient>
    <radialGradient id="beacon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f9d88f" stop-opacity="0.96"/>
      <stop offset="0.44" stop-color="#ef9a62" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#ef9a62" stop-opacity="0"/>
    </radialGradient>
    <pattern id="contours" width="170" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <path d="M-20 24 C28 4 74 4 190 25 M-28 53 C54 26 108 30 206 54" fill="none" stroke="#f7d59a" stroke-opacity="0.14" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <rect width="850" height="700" fill="#0e2631" opacity="0.23"/>
  <circle cx="1235" cy="300" r="270" fill="url(#beacon)"/>
  <path d="M0 470 L180 374 L314 438 L488 310 L654 430 L846 274 L1038 438 L1206 352 L1412 430 L1600 286 V700 H0Z" fill="#173842" opacity="0.88"/>
  <path d="M0 548 L226 466 L396 524 L604 408 L812 534 L1002 412 L1218 514 L1400 446 L1600 510 V700 H0Z" fill="url(#ground)"/>
  <rect x="0" y="388" width="1600" height="312" fill="url(#contours)" opacity="0.9"/>
  <g fill="none" stroke="#f3bd78" stroke-linecap="round">
    <path d="M1138 548 C1217 470 1306 444 1396 466 C1470 484 1519 526 1581 506" stroke-width="5" opacity="0.72"/>
    <path d="M1198 584 C1274 530 1351 518 1426 535 C1491 550 1537 578 1594 570" stroke-width="2" opacity="0.48"/>
  </g>
  <g transform="translate(1270 150)">
    <path d="M0 290 L78 54 L156 290" fill="#f6d49a" opacity="0.12"/>
    <path d="M78 60 V290" stroke="#f9d88f" stroke-width="8" opacity="0.85"/>
    <circle cx="78" cy="58" r="19" fill="#f9d88f"/>
    <circle cx="78" cy="58" r="37" fill="none" stroke="#f9d88f" stroke-opacity="0.35" stroke-width="2"/>
  </g>
  <g fill="#f8e8c7" font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="116" font-size="18" letter-spacing="4" opacity="0.78">NORTHSTAR / FIELD KIT</text>
    <text x="72" y="240" font-size="66" font-weight="700" letter-spacing="-2">Find the next line.</text>
    <text x="76" y="294" font-size="22" opacity="0.78">A quiet instrument for long ways forward.</text>
    <rect x="76" y="364" width="202" height="58" rx="29" fill="#f2a36c"/>
    <text x="113" y="401" font-size="17" font-weight="700" fill="#142d35">EXPLORE THE KIT</text>
  </g>
</svg>
